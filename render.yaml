services:
  - type: web
    name: music-player-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /api/health
    autoDeploy: true
    buildFilter:
      paths:
        - Backend/**
        - Dockerfile
        - render.yaml
    envVars:
      - key: PORT
        value: 8080
      - key: JAVA_OPTS
        value: "-Xmx512m"
      - key: DATABASE_URL
        fromDatabase:
          name: music-player-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JIOSAAVN_API_BASE_URL
        value: https://shnwazdev-jiosaavn-apii.vercel.app/api
      - key: CORS_ALLOWED_ORIGINS
        value: https://music-player-website.vercel.app
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false

databases:
  - name: music-player-db
    plan: free
    region: oregon
    databaseName: music_player_db
    user: music_player_user