# Server Configuration
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Database Configuration (PostgreSQL; set DB_URL or DATABASE_URL in production)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/music_player_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (override via env in production)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Cross-Origin allowed origins (comma separated; env-driven for deployed frontends)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

# JioSaavn API Base URL
jiosaavn.api.base-url=${JIOSAAVN_API_BASE_URL:https://shnwazdev-jiosaavn-apii.vercel.app/api}

# Mail Configuration (set MAIL_HOST/MAIL_USERNAME/MAIL_PASSWORD for a real SMTP; e.g. smtp.gmail.com + app password)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Logging
logging.level.com.musicplayer=INFO
logging.level.org.springframework.security=WARN

# Multipart (for future file upload support)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB